name: Release unsigned desktop builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.14.1
        required: true
        default: v0.14.1
        type: string

permissions:
  contents: write

concurrency:
  group: release-unsigned-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS arm64 unsigned
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app
        run: >-
          pnpm tauri build
          --target aarch64-apple-darwin
          --bundles app
          --no-sign
          --config '{"bundle":{"macOS":{"signingIdentity":null,"hardenedRuntime":false}}}'
      - name: Archive app
        run: |
          app_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dsh-miles-${{ inputs.tag }}-macos-arm64-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-miles-macos-arm64
          path: dsh-miles-${{ inputs.tag }}-macos-arm64-unsigned.zip
          if-no-files-found: error

  macos-intel:
    name: Build macOS x64 (Intel) unsigned
    # 在 Apple Silicon runner 上交叉编译 x86_64：Intel 旧 runner 已退役，
    # 本应用为纯 Rust + WebView（Node 运行时首启时按架构下载），交叉编译安全。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app
        run: >-
          pnpm tauri build
          --target x86_64-apple-darwin
          --bundles app
          --no-sign
          --config '{"bundle":{"macOS":{"signingIdentity":null,"hardenedRuntime":false}}}'
      - name: Archive app
        run: |
          app_path="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dsh-miles-${{ inputs.tag }}-macos-x64-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-miles-macos-x64
          path: dsh-miles-${{ inputs.tag }}-macos-x64-unsigned.zip
          if-no-files-found: error

  windows:
    name: Build Windows x64 unsigned
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-miles-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Build Linux x64 (Ubuntu 22.04) unsigned
    # 与 build-linux.yml 一致：22.04 的 glibc/WebKitGTK 产物兼容 22.04 及更新版本。
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          apt_ok=0
          for i in {1..3}; do
            if timeout 180 sudo apt-get update \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              -o Acquire::ftp::Timeout=60; then
              apt_ok=1
              break
            fi
            echo "apt-get update failed, retrying ($i/3)..."
            sleep 10
          done
          [ "$apt_ok" = "1" ] || { echo "apt-get update failed 3 times, aborting"; exit 1; }
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --bundles appimage,deb --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-miles-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    name: Publish unsigned release
    needs: [macos, macos-intel, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "dsh-miles $RELEASE_TAG" \
              --notes "Unsigned test release for manual installation. macOS users may need to remove quarantine before opening." \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "dsh-miles $RELEASE_TAG" \
              --notes "Unsigned test release for manual installation. macOS users may need to remove quarantine before opening." \
              --prerelease
          fi
